services:
  utm-pipeline-api:
    build: .
    image: utm-pipeline-api:latest
    command: ["python", "-m", "app.main"]
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  daily-product-utm-worker:
    build: .
    image: daily-product-utm-worker:latest
    command: ["python", "-m", "app.workers.daily_product_utm_worker"]
    env_file: .env
    restart: unless-stopped

  retrospective-product-utm-worker:
    build: .
    image: retrospective-product-utm-worker:latest
    command: ["python", "-m", "app.workers.retrospective_product_utm_worker"]
    env_file: .env
    restart: unless-stopped

  global-utm-retrospective-worker:
    build: .
    image: global-utm-retrospective-worker:latest
    command: ["python", "-m", "app.workers.global_utm_retrospective_worker"]
    env_file: .env
    restart: unless-stopped
