name: Global UTM Retrospective

on:
  push:
    branches:
      - master
  schedule:
    - cron: "35 18 * * *"
  workflow_dispatch:

jobs:
  run-global-retrospective-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GET_BRANDS_API: ${{ secrets.GET_BRANDS_API }}
      PASSWORD_AES_KEY: ${{ secrets.PASSWORD_AES_KEY }}
      PIPELINE_AUTH_HEADER: ${{ secrets.PIPELINE_AUTH_HEADER }}
      GLOBAL_RETROSPECTIVE_CRON: "35 18 * * *"
      GLOBAL_RETROSPECTIVE_LOOKBACK_DAYS: "2"
      MAX_BRAND_RETRIES: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run global retrospective UTM worker
        run: python -m app.workers.global_utm_retrospective_worker
