name: Product UTM Daily

on:
  push:
    branches:
      - master
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

jobs:
  run-daily-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GET_BRANDS_API: ${{ secrets.GET_BRANDS_API }}
      PASSWORD_AES_KEY: ${{ secrets.PASSWORD_AES_KEY }}
      PIPELINE_AUTH_HEADER: ${{ secrets.PIPELINE_AUTH_HEADER }}
      DAILY_WORKER_CRON: "3,13,23,33,43,53 * * * *"
      RETROSPECTIVE_WORKER_CRON: "0 0 */2 * *"
      TOP_PRODUCT_LIMIT: "10"
      TOP_PRODUCT_LOOKBACK_DAYS: "30"
      RETROSPECTIVE_DAYS: "2"
      GRAPHQL_MIN_BALANCE: "100"
      GRAPHQL_MAX_RETRIES: "3"
      GRAPHQL_BASE_BACKOFF_SECONDS: "2"
      GRAPHQL_SLEEP_BUFFER_SECONDS: "1"
      DB_BATCH_SIZE: "500"
      WORKFLOW_TIMEOUT_MINUTES: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily product x utm worker
        run: python -m app.workers.daily_product_utm_worker
